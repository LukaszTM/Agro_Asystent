# Program na komputer z Windows (plan, pkt 1: „potem Windows").
#
# Uruchamiany **tylko ręcznie**: przez wysłanie znacznika `pc-*`
# (np. `git tag pc-0.1.0 && git push origin pc-0.1.0`) albo przyciskiem
# Run workflow, gdy ten plik trafi na gałąź główną. Nie wisi na każdym
# commicie, bo maszyny z Windows liczą się w darmowym limicie GitHuba
# podwójnie, a budżet projektu to zero.
#
# Wynik to katalog z plikiem agro_asystent.exe i bibliotekami. Przy
# znaczniku `pc-*` powstaje z niego wydanie (Releases) ze stałym linkiem
# do pobrania; przy ręcznym uruchomieniu — artefakt .zip na 14 dni.
# Program nie jest podpisany, więc Windows pokaże ostrzeżenie SmartScreen;
# „Więcej informacji" → „Uruchom mimo to".
name: Zbuduj program na Windows

on:
  workflow_dispatch:
  push:
    # Budowanie na żądanie z gałęzi roboczej: wystarczy zmienić plik
    # `.github/zbuduj-windows` (wpisać nową datę) i wysłać commit.
    # Żadna inna zmiana w kodzie Windowsa nie budzi tego przepływu.
    branches:
      - 'claude/**'
    paths:
      - '.github/zbuduj-windows'
    tags:
      - 'pc-*'

jobs:
  windows:
    name: Windows (release)
    runs-on: windows-latest
    permissions:
      # Potrzebne tylko do założenia wydania przy znaczniku `pc-*`.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Zależności
        run: flutter pub get

      # Katalogu `windows/` nie tworzymy tu od nowa — jest w repozytorium.
      - name: Budowanie
        run: flutter build windows --release

      - name: Spis plików wyniku
        shell: bash
        run: ls -R build/windows/x64/runner/Release | head -40

      - name: Paczka do pobrania
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force wydanie | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath wydanie/agro-asystent-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: agro-asystent-windows
          path: build/windows/x64/runner/Release/
          retention-days: 14

      # Stały link do pobrania. Artefakt z zakładki Actions wymaga
      # zalogowania na GitHubie i znika po 14 dniach — wydanie pobiera
      # każdy, bez konta, tak samo jak APK na telefon.
      - name: Wydanie do pobrania bez logowania
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Znacznik `pc-*` robi wydanie pod swoją nazwą; zwykłe budowanie
          # odświeża jedno wspólne wydanie „pc-test".
          if [[ "$GITHUB_REF" == refs/tags/pc-* ]]; then
            nazwa="$GITHUB_REF_NAME"
            tytul="Agro Asystent na Windows $GITHUB_REF_NAME"
            przedwydanie=""
          else
            nazwa="pc-test"
            tytul="Agro Asystent na Windows — wersja testowa"
            przedwydanie="--prerelease"
          fi

          wersja=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          plik="agro-asystent-windows-$wersja.zip"
          mv wydanie/agro-asystent-windows.zip "$plik"

          gh release create "$nazwa" \
            --target "$GITHUB_SHA" \
            $przedwydanie \
            --title "$tytul" \
            --notes-file .github/wydanie-windows.md || true
          gh release upload "$nazwa" "$plik" --clobber

          # W wydaniu ma leżeć tylko bieżąca wersja.
          gh release view "$nazwa" --json assets --jq '.assets[].name' \
            | while read -r stary; do
                case "$stary" in
                  "$plik") ;;
                  *.zip)
                    echo "usuwam stary plik: $stary"
                    gh release delete-asset "$nazwa" "$stary" -y
                    ;;
                esac
              done
