# Budowanie pliku APK do wgrania na telefon.
#
# Buduje się sam po każdej zmianie kodu na gałęzi roboczej i na `main`,
# żeby świeży plik .apk był zawsze do pobrania na telefonie — bez komputera
# i bez wiersza poleceń. Commity z samą dokumentacją budowania nie wywołują
# (`paths-ignore`), bo pełny build trwa kilka minut.
#
# Można też uruchomić ręcznie (Actions → „Zbuduj APK" → Run workflow) albo
# wypchnąć znacznik `apk-*`.
# Wynik można pobrać dwojako: jako artefakt (plik .zip) albo — wygodniej na
# telefonie — jako plik .apk dołączony do wydania „apk-test".
name: Zbuduj APK

on:
  workflow_dispatch:
    inputs:
      wydanie:
        description: Dołączyć APK do wydania „apk-test" (łatwy link na telefon)
        type: boolean
        default: true
  push:
    branches: [main, 'claude/**']
    tags: ['apk-*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'tools/**'
      - 'dane/**'
      - '.github/workflows/ci.yml' 

permissions:
  contents: write

jobs:
  apk:
    name: APK (release)
    runs-on: ubuntu-latest
    # Sekrety stoją w `env` zadania, bo kontekst `secrets` nie jest
    # dostępny w `if` kroku — przepływ z takim warunkiem nie startuje
    # wcale („0 jobs").
    env:
      AGRO_KEYSTORE_BASE64: ${{ secrets.AGRO_KEYSTORE_BASE64 }}
      AGRO_KEYSTORE_HASLO: ${{ secrets.AGRO_KEYSTORE_HASLO }}
      AGRO_KLUCZ_ALIAS: ${{ secrets.AGRO_KLUCZ_ALIAS }}
      AGRO_KLUCZ_HASLO: ${{ secrets.AGRO_KLUCZ_HASLO }}
    steps:
      - uses: actions/checkout@v4

      # AGP 9 i Kotlin w tym projekcie celują w Javę 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      # `packages: ''` jest konieczne: domyślnie akcja instaluje pakiet
      # `tools`, którego nie ma już w repozytorium SDK — i przerywa build
      # („Failed to find package 'tools'").
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Składniki Android SDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      # Klucz podpisujący leży w sekretach repozytorium, nie w kodzie.
      # Gdy sekretów nie ma, krok nic nie robi, a Gradle podpisuje wydanie
      # kluczem debugowym (i mówi o tym w logu). Patrz
      # `docs/wydanie-android.md`.
      - name: Klucz podpisujący z sekretów
        if: env.AGRO_KEYSTORE_BASE64 != ''
        run: |
          echo "$AGRO_KEYSTORE_BASE64" | base64 -d \
            > "$RUNNER_TEMP/agro-upload.jks"
          echo "AGRO_KEYSTORE_PLIK=$RUNNER_TEMP/agro-upload.jks" \
            >> "$GITHUB_ENV"
          echo "podpis=wlasny" >> "$GITHUB_ENV"

      - name: Zależności
        run: flutter pub get

      - name: Budowanie APK
        # Dwa pliki: uniwersalny (wchodzi na każdy telefon) i mniejszy,
        # tylko na arm64 — przy rozdawaniu testerom liczy się każdy
        # megabajt pobierany z pakietu danych. Ten sam numer wersji
        # w obu, żeby dało się je wymieniać bez odinstalowywania.
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi \
            -Pforce-version-code-ignoring-abi=true

      - name: Nazwy plików z numerem wersji
        run: |
          wersja=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          plik="agro-asystent-$wersja.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$plik"
          maly="agro-asystent-$wersja-arm64.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$maly"
          ls -lh "$plik" "$maly"
          echo "plik=$plik" >> "$GITHUB_ENV"
          echo "maly=$maly" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: agro-asystent-apk
          path: |
            ${{ env.plik }}
            ${{ env.maly }}
          retention-days: 14

      - name: Wydanie do pobrania na telefon
        if: github.event_name != 'workflow_dispatch' || inputs.wydanie
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${podpis:-debugowy}" = "wlasny" ]; then
            opis="Wersja testowa do wgrania na telefon. Podpisana kluczem
          wydawniczym z sekretów repozytorium, więc kolejne pliki wgrywają
          się na wierzch poprzedniego. W telefonie trzeba raz zezwolić na
          instalację z nieznanych źródeł."
          else
            opis="Wersja testowa do wgrania na telefon. Podpisana kluczem
          debugowym, więc: w telefonie trzeba zezwolić na instalację z
          nieznanych źródeł, a przed wgraniem nowszego pliku odinstalować
          poprzedni (każdy build ma inny podpis). Nie nadaje się do Google
          Play — jak dodać własny klucz, mówi docs/wydanie-android.md."
          fi
          gh release create apk-test \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Agro Asystent — APK do testów" \
            --notes "$opis" || true
          gh release upload apk-test "$plik" "$maly" --clobber
