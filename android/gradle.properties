org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kompilacja przyrostowa Kotlina zapisuje ścieżki źródeł względem katalogu
# projektu. Gdy projekt leży na innym dysku niż pamięć podręczna paczek
# (PUB_CACHE, zwykle C:\Users\...\AppData\Local\Pub\Cache), ścieżki z dwóch
# dysków nie dają się zapisać względnie i build wtyczki natywnej przerywa się
# błędem „this and base files have different roots". Wyłączenie kosztuje kilka
# sekund przy przebudowie, ale działa na każdym ustawieniu dysków.
kotlin.incremental=false
