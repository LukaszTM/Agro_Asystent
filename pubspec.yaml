name: agro_asystent
description: "Dokumentacja gospodarstwa: ewidencja zabiegów, nawożenia i terminów dla ARiMR"
publish_to: 'none'

# Wersja aplikacji. Wersja danych (słowniki środków, progi prawne) jest osobna
# i trzymana w assets/dane/*.json — patrz CLAUDE.md.
version: 0.2.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Lokalna baza — rdzeń trybu offline-first (Android: natywne SQLite).
  sqflite: ^2.4.4+1
  # SQLite na komputerze (Windows, Linux) — program na PC z planu (pkt 1)
  # nie ma natywnego SQLite systemu, więc bierze bibliotekę ze sobą.
  # Ta sama droga służy testom bazy i migracji bez emulatora.
  sqflite_common_ffi: ^2.4.3
  # Ścieżki plików i katalogi systemowe (baza, kopie zapasowe, eksport).
  path: ^1.9.1
  path_provider: ^2.1.6
  # Formatowanie dat i liczb po polsku (ewidencja, wydruki).
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  sqflite_common: ^2.5.14
  http: ^1.6.0
  file_selector: ^1.1.0
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  archive: ^4.5.2
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  # Odczyt kanałów RSS z wiadomościami rolniczymi (licencja MIT).
  xml: ^7.1.0
  # Otwarcie artykułu u wydawcy w przeglądarce (licencja BSD-3, zespół
  # Fluttera). Program nie pokazuje cudzych treści u siebie.
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Dane z wersją: progi, terminy i stawki z przepisów. Nigdy w kodzie Dart.
    - assets/dane/
    # Logo aplikacji — źródło ikon i ekranu powitalnego.
    - assets/logo/
    # Czcionka wydruków (fragment DejaVu Sans, licencja w LICENCJA.txt).
    - assets/czcionki/
